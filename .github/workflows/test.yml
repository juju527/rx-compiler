name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: Semantic
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ANTLR_VERSION: 4.13.2
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl default-jre-headless python3

      - name: Install ANTLR generator for the regeneration check
        run: |
          curl -fsSL --retry 3 "https://www.antlr.org/download/antlr-${ANTLR_VERSION}-complete.jar" \
            -o "$RUNNER_TEMP/antlr.jar"

      - name: Verify generated parser sources
        run: |
          make generate ANTLR="java -jar $RUNNER_TEMP/antlr.jar"
          git diff --exit-code -- generated/
          test -z "$(git ls-files --others --exclude-standard -- generated/)"

      - name: Run Semantic tests from standalone judge config
        run: |
          make -f tests/custom/oj/Makefile test STAGE=semantic FILTER=official:semantic \
            CXX=g++ \
            ANTLR=false
